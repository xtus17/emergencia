name: Cron Emergencia
# https://console.cron-job.org/jobs/6971521/history
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      # 1. Recuperar el caché más reciente
      - name: Restore Cache
        id: restore-cache
        uses: actions/cache/restore@v3
        with:
          path: .emergencia_cache
          # Truco: Buscamos cualquier caché que empiece por este prefijo
          # pero definimos una key que no existe para forzar la búsqueda en restore-keys
          key: cache-dynamic-${{ github.run_id }}
          restore-keys: |
            emergencia-v1-

      # 2. Lógica de Comparación (Bash)
      - name: Fetch & Compare
        id: check
        run: |
          mkdir -p .emergencia_cache
          
          echo "========================================"
          echo "🔎 ESTADO INICIAL DEL CACHÉ"
          echo "========================================"
          
          LAST_NUMERO=""
          if [ -f ".emergencia_cache/last_numero_parte.txt" ]; then
            echo "✅ Archivo de caché encontrado (.emergencia_cache/last_numero_parte.txt)"
            LAST_NUMERO=$(cat .emergencia_cache/last_numero_parte.txt)
            echo "📄 Contenido recuperado: [$LAST_NUMERO]"
          else
            echo "❌ No se encontró caché previo."
          fi
          echo "========================================"

          echo "📡 CONSULTANDO ENDPOINT..."
          RESPONSE=$(curl -s https://emergencia-seven.vercel.app/api/scrapper || echo "")
          
          echo "📥 RESPUESTA DEL SERVIDOR:"
          echo "$RESPONSE"
          echo "========================================"
          
          if [ -z "$RESPONSE" ] || [ "$RESPONSE" == "null" ]; then
             echo "⚠️ API vacía o error."
             echo "SHOULD_RUN=false" >> $GITHUB_ENV
             exit 0
          fi

          # VERIFICAR SI DATA ES NULL ANTES DE CONTINUAR
          IS_DATA_NULL=$(echo "$RESPONSE" | jq -r '.data == null')
          
          if [ "$IS_DATA_NULL" == "true" ]; then
             echo "🛑 ALERTA: La API devolvió 'data: null'."
             echo "No hay emergencias activas o el scraper falló."
             echo "NO se actualizará el caché ni se enviarán notificaciones."
             echo "SHOULD_RUN=false" >> $GITHUB_ENV
             exit 0
          fi

          # C. EXTRAER NUEVO NUMERO PARTE (Solo si data no es null)
          NEW_NUMERO=$(echo "$RESPONSE" | jq -r '.data[-1]' 2>/dev/null)

          echo "🔢 NumeroParte extraído de API: [$NEW_NUMERO]"
          echo "💾 NumeroParte en Caché:      [$LAST_NUMERO]"
          echo "========================================"

          if [ "$NEW_NUMERO" == "null" ] || [ -z "$NEW_NUMERO" ]; then
             echo "⚠️ No se pudo extraer numeroParte válido (valor vacío o null)."
             echo "SHOULD_RUN=false" >> $GITHUB_ENV
             exit 0
          fi

          if [ "$NEW_NUMERO" == "$LAST_NUMERO" ]; then
             echo "✅ IGUALES. No hacemos nada."
             echo "SHOULD_RUN=false" >> $GITHUB_ENV
          else
             echo "🚀 DIFERENTES. ¡Nueva emergencia detectada!"
             echo "SHOULD_RUN=true" >> $GITHUB_ENV
             
             {
               echo 'EMERGENCIA_RESPONSE<<ENDJSON'
               echo "$RESPONSE"
               echo 'ENDJSON'
             } >> "$GITHUB_ENV"

             echo "$NEW_NUMERO" > .emergencia_cache/last_numero_parte.txt
             echo "📝 Nuevo valor escrito en caché local."
          fi

      # 3. Guardar NUEVO Caché (SOLO SI CAMBIÓ)
      # Al guardar con una key nueva (usando run_id), forzamos a GitHub a crear una nueva entrada.
      # Si son iguales, saltamos este paso y el caché viejo sigue siendo válido para la próxima.
      - name: Save Cache
        if: env.SHOULD_RUN == 'true'
        uses: actions/cache/save@v3
        with:
          path: .emergencia_cache
          key: emergencia-v1-${{ github.run_id }}

      # 4. Configurar Node.js (SOLO SI CAMBIÓ)
      - name: Setup Node
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          
      # 5. Instalar y Ejecutar Script (SOLO SI CAMBIÓ)
      - name: Install & Notify
        if: env.SHOULD_RUN == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_CREDENTIALS }}
          EMERGENCIA_RESPONSE: ${{ env.EMERGENCIA_RESPONSE }}
        run: |
          echo "⚙️ Instalando dependencias..."
          echo "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json
          npm install
          
          echo "🚀 Ejecutando script de notificaciones..."
          node sendNotifications.js
